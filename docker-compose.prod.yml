# ONE-WEEK AWS DEPLOYMENT (one EC2 server).  Run on the server from the claim-ops folder:
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from the internet (ports 80/443). Database, Redis, Kafka, Prometheus and Grafana are NOT exposed.
# Values like ${MYSQL_ROOT_PASSWORD} come from the .env file on the server (see .env.aws.example).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: opd_wallet
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_INSTANCE_ID: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"      # keeps memory use small on a single server
    volumes:
      - kafka_data:/var/lib/kafka/data

  api:
    build: .
    image: opd-backend:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/opd_wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ap-south-1
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_started}

  worker:
    image: opd-backend:1.0.0
    restart: unless-stopped
    command: ["python", "-m", "app.worker.claims_worker"]
    env_file: .env
    environment:
      MYSQL_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/opd_wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ap-south-1
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_started}
      api: {condition: service_started}

  frontend:
    build:
      context: ./my-opd-ui
      args:
        REACT_APP_API_URL: ${PUBLIC_URL}/api      # the website calls the API through Caddy on the same address
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}          # ":80" = plain HTTP on the IP address. A domain name = automatic HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, frontend]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"                     # reachable only from the server itself (use an SSH tunnel)
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/opd-wallet.json
    ports:
      - "127.0.0.1:3000:3000"                     # reachable only from the server itself (use an SSH tunnel)
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  mysql_data:
  kafka_data:
  caddy_data:
  prometheus_data:
  grafana_data:
