# STAGE 2: the whole system in containers.   Start:  docker compose up -d --build     Stop:  docker compose down
# (down keeps your data. `docker compose down -v` would delete the database.)
services:
  mysql:
    image: mysql:8.0
    container_name: opd_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: opd_wallet
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: opd_cache
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: opd_kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two doors into Kafka:
      #   kafka:19092      -> for the other containers (api, worker)
      #   localhost:9092   -> for programs running directly on your computer
      #   host.docker.internal:9094 -> for Kubernetes pods running in Docker Desktop
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092,K8S://host.docker.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,K8S:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_INSTANCE_ID: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---- your application ----
  api:
    build: .
    image: opd-backend:1.0.0
    container_name: opd_api
    env_file: .env                       # your keys (Groq, HubSpot, JWT ...)
    environment:                         # these override the localhost values from .env
      MYSQL_URL: mysql+pymysql://root:root_password@mysql:3306/opd_wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis                  # in case cache.py reads host/port separately
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - uploads:/srv/uploads             # shared with the worker: the API saves bills, the worker reads them
    depends_on: [mysql, kafka, redis]
    restart: on-failure                  # mysql/kafka need a few seconds to start; retry until they are ready

  worker:
    image: opd-backend:1.0.0
    container_name: opd_worker
    command: ["python", "-m", "app.worker.claims_worker"]
    env_file: .env
    environment:
      MYSQL_URL: mysql+pymysql://root:root_password@mysql:3306/opd_wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis                  # in case cache.py reads host/port separately
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "8001:8001"
    volumes:
      - uploads:/srv/uploads
    depends_on: [mysql, kafka, redis]
    restart: on-failure

  # ---- website (React). Open http://localhost:3001  (3000 is taken by Grafana) ----
  frontend:
    build:
      context: ./my-opd-ui
      args:
        REACT_APP_API_URL: http://localhost:8000     # the browser calls the API through your computer's port 8000
    image: opd-frontend:1.0.0
    container_name: opd_frontend
    ports:
      - "3001:80"
    depends_on: [api]

  # ---- monitoring ----
  prometheus:
    image: prom/prometheus:latest
    container_name: opd_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: opd_grafana
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/opd-wallet.json
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  uploads: